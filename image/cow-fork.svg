<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="300" rx="12" fill="#fafafa"/>
  <rect width="860" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">fork 写时复制（Copy-on-Write）</text>

  <rect x="40" y="60" width="240" height="200" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">父进程页表</text>
  <rect x="60" y="108" width="200" height="36" rx="6" fill="#fff" stroke="#1565c0"/><text x="160" y="132" text-anchor="middle" font-size="12">页 A  只读映射</text>
  <rect x="60" y="156" width="200" height="36" rx="6" fill="#fff" stroke="#1565c0"/><text x="160" y="180" text-anchor="middle" font-size="12">页 B  只读映射</text>
  <text x="160" y="230" text-anchor="middle" font-size="11" fill="#546e7a">fork 后立刻共享物理页</text>

  <rect x="580" y="60" width="240" height="200" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="700" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">子进程页表</text>
  <rect x="600" y="108" width="200" height="36" rx="6" fill="#fff" stroke="#e65100"/><text x="700" y="132" text-anchor="middle" font-size="12">页 A  只读映射</text>
  <rect x="600" y="156" width="200" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/><text x="700" y="180" text-anchor="middle" font-size="12">页 B' 写时新拷贝</text>
  <text x="700" y="230" text-anchor="middle" font-size="11" fill="#546e7a">子进程写页 B 才分配</text>

  <rect x="310" y="110" width="240" height="90" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="430" y="145" text-anchor="middle" font-size="13" fill="#4a148c">物理页 A（共享）</text>
  <text x="430" y="172" text-anchor="middle" font-size="13" fill="#4a148c">物理页 B / B'</text>
  <text x="430" y="280" text-anchor="middle" font-size="12" fill="#78909c">fork 成本主要是复制页表。exec 会丢掉旧地址空间，所以 fork+exec 才划算</text>

</svg>
