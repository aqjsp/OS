<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="300" rx="12" fill="#fafafa"/>
  <rect width="900" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">缺页：虚拟页还没对应物理页</text>

  <rect x="40" y="56" width="240" height="200" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">进程虚拟空间</text>
  <rect x="60" y="100" width="200" height="36" rx="6" fill="#bbdefb" stroke="#1565c0"/><text x="160" y="124" text-anchor="middle" font-size="12">已映射、在内存</text>
  <rect x="60" y="144" width="200" height="36" rx="6" fill="#ffe0b2" stroke="#e65100"/><text x="160" y="168" text-anchor="middle" font-size="12">已映射、在磁盘/未分配</text>
  <rect x="60" y="188" width="200" height="36" rx="6" fill="#eceff1" stroke="#90a4ae"/><text x="160" y="212" text-anchor="middle" font-size="12">根本没 mmap/brk</text>
  <text x="160" y="240" text-anchor="middle" font-size="11" fill="#546e7a">第三种是 SIGSEGV，不是缺页</text>

  <rect x="330" y="56" width="250" height="200" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="455" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">缺页进内核之后</text>
  <text x="455" y="120" text-anchor="middle" font-size="12">找空闲页 / 换出一页</text>
  <text x="455" y="148" text-anchor="middle" font-size="12">读文件或填零页</text>
  <text x="455" y="176" text-anchor="middle" font-size="12">写页表、冲 TLB</text>
  <text x="455" y="204" text-anchor="middle" font-size="12">回到那条 load/store 重试</text>
  <text x="455" y="236" text-anchor="middle" font-size="11" fill="#bf360c">用户态以为这条指令刚执行完</text>

  <rect x="620" y="56" width="250" height="200" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">为什么可以「超卖」</text>
  <text x="745" y="124" text-anchor="middle" font-size="12">malloc/mmap 先改页表</text>
  <text x="745" y="152" text-anchor="middle" font-size="12">物理页等到真写入</text>
  <text x="745" y="180" text-anchor="middle" font-size="12">fork 后 COW 同理</text>
  <text x="745" y="216" text-anchor="middle" font-size="11" fill="#1b5e20">VSZ 可以远大于 RSS</text>
  <text x="745" y="240" text-anchor="middle" font-size="11" fill="#1b5e20">overcommit 耗尽才 OOM</text>
</svg>
